<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="Kill Tracker Overlay">
  <meta property="og:description" content="Tracks boss kills and drops via Alt1 chat OCR.">
  <title>Kill Tracker</title>

  <script src="./vendor/alt1/base/index.js"></script>
  <script src="./vendor/alt1/ocr/index.js"></script>
  <script src="./vendor/alt1/chatbox/index.js"></script>

  <link rel="stylesheet" href="./src/css/nis.css" />
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body class="nis">
  <div id="app" class="panel">
    <div class="panel-header">
      <div class="boss-block">
        <img id="boss-image" class="boss-image" alt="Boss" />
        <div class="boss-text">
          <div id="boss-name" class="boss-name">Waiting for boss...</div>
        </div>
      </div>
      <div class="session-stats">
        <div class="stat-line"><span class="label">Session KC:</span><span class="value" id="stat-session">—</span></div>
        <div class="stat-line"><span class="label">Pet KC:</span><span class="value" id="stat-pet">—</span></div>
        <div class="stat-line"><span class="label">Since Pet:</span><span class="value" id="stat-since-pet">—</span></div>
      </div>
    </div>

    <div class="panel-body">
      <div class="stat-column">
        <div class="stat-line"><span class="label">Total KC:</span><span class="value" id="stat-total">—</span></div>
        <div class="stat-line"><span class="label">Normal Mode:</span><span class="value" id="stat-nm">—</span></div>
        <div class="stat-line"><span class="label">Hard Mode:</span><span class="value" id="stat-hm">—</span></div>
        <div class="stat-line"><span class="label">Session KC:</span><span class="value" id="stat-session-inline">—</span></div>
        <div class="stat-line"><span class="label">Pet KC:</span><span class="value" id="stat-pet-inline">—</span></div>
        <div class="stat-line"><span class="label">Since Pet:</span><span class="value" id="stat-since-pet-inline">—</span></div>
      </div>

      <div class="collection-section">
        <div class="collection-meta">
          <div class="stat-line compact"><span class="label">Collection log:</span><span class="value" id="stat-log">—</span></div>
          <div class="stat-line compact"><span class="label">Total Uniques:</span><span class="value" id="stat-uniques">—</span></div>
          <div class="stat-line compact"><span class="label">Dry Streak:</span><span class="value" id="stat-dry">—</span></div>
        </div>
        <div id="collection-log" class="collection-grid"></div>
      </div>
    </div>

    <div class="latest-row">
      <span class="label">Latest Unique:</span>
      <div id="latest-unique-text" class="value">—</div>
      <div id="latest-unique-icons" class="latest-icons"></div>
    </div>

    <div id="output" class="console"></div>
  </div>

  <script src="./src/script.js"></script>
</body>
</html>
