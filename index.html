<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="Kill Tracker Overlay">
  <meta property="og:description" content="Tracks boss kills and drops via Alt1 chat OCR.">
  <title>Kill Tracker</title>

  <script src="https://www.unpkg.com/alt1/dist/base/index.js"></script>
  <script src="https://www.unpkg.com/alt1/dist/ocr/index.js"></script>
  <script src="https://www.unpkg.com/alt1/dist/chatbox/index.js"></script>

  <link rel="stylesheet" href="https://runeapps.org/nis/nis.css" />
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body class="nis">
  <div id="app">
    <div id="header">
      <img id="boss-image" alt="Boss" />
      <div id="header-text">
        <div id="boss-name">Waiting for boss...</div>
        <div id="boss-mode">--</div>
      </div>
    </div>

    <div id="stats">
      <div class="stat"><span class="label">Total KC</span><span id="stat-total">—</span></div>
      <div class="stat sub"><span class="label">Normal</span><span id="stat-nm">—</span></div>
      <div class="stat sub"><span class="label">Hard</span><span id="stat-hm">—</span></div>
      <div class="stat"><span class="label">Session</span><span id="stat-session">—</span></div>
      <div class="stat"><span class="label">Pet KC</span><span id="stat-pet">—</span></div>
      <div class="stat"><span class="label">Since Pet</span><span id="stat-since-pet">—</span></div>
      <div class="stat"><span class="label">Log</span><span id="stat-log">—</span></div>
      <div class="stat"><span class="label">Uniques</span><span id="stat-uniques">—</span></div>
      <div class="stat"><span class="label">Dry Streak</span><span id="stat-dry">—</span></div>
      <div class="stat"><span class="label">Latest</span><span id="stat-latest">—</span></div>
    </div>

    <div id="clues"></div>

    <div id="collection-log"></div>

    <div id="output"></div>
  </div>

  <script src="./src/script.js"></script>
</body>
</html>
