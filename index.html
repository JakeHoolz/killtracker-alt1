<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="Kill Tracker Overlay">
  <meta property="og:description" content="Tracks boss kills and drops via Alt1 chat OCR.">
  <title>Kill Tracker</title>

  <script src="./vendor/alt1/base/index.js"></script>
  <script src="./vendor/alt1/ocr/index.js"></script>
  <script src="./vendor/alt1/chatbox/index.js"></script>

  <link rel="stylesheet" href="./src/css/nis.css" />
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body class="nis">
  <div id="overlay-container">
    <div id="auth-overlay" class="auth-overlay">
      <form id="auth-form" class="auth-form">
        <div class="auth-header">
          <h2>Sign in to sync</h2>
          <button type="button" id="logout-button" class="link-button">Logout</button>
        </div>
        <label>
          <span>Username</span>
          <input id="auth-username" name="username" autocomplete="username" required />
        </label>
        <label>
          <span>Password</span>
          <input id="auth-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <div class="auth-actions">
          <button type="submit" data-action="login">Login</button>
          <button type="button" id="register-button">Register</button>
        </div>
        <div id="auth-status" class="auth-status">Not signed in</div>
      </form>
      <div id="auth-summary" class="auth-summary hidden">
        <div class="auth-user">Logged in as <span id="auth-user-name"></span></div>
        <div class="auth-status" id="auth-status-compact"></div>
      </div>
    </div>
    <div id="boss-header">
      <img id="boss-image" src="" alt="Boss" />
      <div id="boss-info">
        <h1 id="boss-name">Waiting for boss...</h1>
      </div>
    </div>

    <div id="main-content">
      <div id="stats-panel">
        <div class="stat-row">
          <span class="label">Total KC</span>
          <span id="stat-total" class="stat-value">—</span>
        </div>

        <div class="stat-row stat-sub">
          <span class="label">Normal Mode</span>
          <span id="stat-nm" class="stat-value">—</span>
        </div>

        <div class="stat-row stat-sub">
          <span class="label">Hard Mode</span>
          <span id="stat-hm" class="stat-value">—</span>
        </div>

        <div class="stat-row">
          <span class="label">Session KC</span>
          <span id="stat-session" class="stat-value">—</span>
        </div>

        <div class="stat-row stat-hidden">
          <span class="label">Session KC</span>
          <span id="stat-session-inline" class="stat-value">—</span>
        </div>

        <div class="stat-row">
          <span class="label">Pet KC</span>
          <span id="stat-pet" class="stat-value">—</span>
        </div>

        <div class="stat-row stat-hidden">
          <span class="label">Pet KC</span>
          <span id="stat-pet-inline" class="stat-value">—</span>
        </div>

        <div class="stat-row">
          <span class="label">Since Pet</span>
          <span id="stat-since-pet" class="stat-value">—</span>
        </div>

        <div class="stat-row stat-hidden">
          <span class="label">Since Pet</span>
          <span id="stat-since-pet-inline" class="stat-value">—</span>
        </div>

        <div class="stat-row">
          <span class="label">Log Progress</span>
          <span id="stat-log" class="stat-value">—</span>
        </div>

        <div class="stat-row">
          <span class="label">Total Uniques</span>
          <span id="stat-uniques" class="stat-value">—</span>
        </div>

        <div class="stat-row">
          <span class="label">Dry Streak</span>
          <span id="stat-dry" class="stat-value">—</span>
        </div>

        <div class="stat-row clue-heading">
        </div>

        <div id="clues" class="clues-grid"></div>
      </div>

      <div id="log-panel">
        <div id="collection-log" class="collection-grid"></div>
      </div>
    </div>

    <div id="latest-unique-panel">
      <div class="stat-row latest-row">
        <span class="label">Latest Unique</span>
        <div id="latest-unique-icons" class="latest-icons"></div>
        <span id="latest-unique-text" class="stat-value">—</span>
      </div>
    </div>

    <div id="output" class="console"></div>
  </div>

  <script src="./src/script.js"></script>
</body>
</html>
